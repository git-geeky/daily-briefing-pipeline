when:
  - event: push
  - event: manual

steps:
  validate-python-json:
    image: python:3.12-slim
    commands:
      - pip install --quiet -r requirements.txt
      - |
        python - <<'PY'
        from pathlib import Path

        failures = []
        for path in sorted(Path(".").rglob("*.py")):
            if ".git" in path.parts:
                continue
            try:
                compile(path.read_text(encoding="utf-8-sig"), str(path), "exec")
            except Exception as exc:
                failures.append(f"{path}: {exc}")
        if failures:
            raise SystemExit("\n".join(failures))
        PY
      - |
        python - <<'PY'
        import json
        from pathlib import Path

        failures = []
        for path in sorted(Path(".").rglob("*.json")):
            if ".git" in path.parts:
                continue
            try:
                json.loads(path.read_text(encoding="utf-8-sig"))
            except Exception as exc:
                failures.append(f"{path}: {exc}")
        if failures:
            raise SystemExit("\n".join(failures))
        PY
      - python -m unittest discover -s tests -p 'test_*.py' -v
      # The full shared suite: runs the abstract mixins in tests/shared_test_support.py
      # against the in-repo reference runner (same wrapper layer production uses).
      - python -m unittest discover -s reference_runner/scripts/tests -p 'test_*.py' -v
